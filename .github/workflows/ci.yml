name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commits, not tags: a tag can be moved to other code
# later, a commit cannot. Dependabot (.github/dependabot.yml) bumps the
# commit and keeps the version comment next to it in step.
jobs:
  test:
    name: Tests and coverage
    # macOS: the Rust tests build the app on Tauri's mock runtime, and the
    # global-shortcut and tray plugins need a window-server session, which
    # the macOS runners have. Both coverage floors (75 % lines) are enforced
    # by the commands themselves; see CONTRIBUTING.md.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      - run: npm ci
      - name: Type-check and build the frontend
        run: npm run build
      - name: Frontend tests (75 % line-coverage floor)
        run: npm run test:coverage
      - name: Rust tests (75 % line-coverage floor)
        run: npm run test:rust:coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock
